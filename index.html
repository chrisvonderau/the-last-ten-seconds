<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#050a16">

<title>The Last Ten Seconds</title>
<style>
:root{--ink:#050a16;--ink2:#0d1a2e;--cyan:#4fe3ff;--amber:#ffb347;--red:#ff3b4a;--txt:#e7eef8;--dim:#93a4bb;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);--cap:1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{position:fixed;inset:0}
canvas#view{position:absolute;inset:0;display:block}
#play{position:absolute;inset:0;touch-action:none}
.hidden{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.btn{min-width:56px;min-height:56px;padding:14px 26px;border-radius:14px;background:rgba(18,34,58,.92);border:1px solid rgba(79,227,255,.35);color:var(--txt);font-weight:700;font-size:19px;letter-spacing:.02em}
.btn:hover{border-color:var(--cyan)}
.btn.primary{background:linear-gradient(180deg,#14425a,#0e2c44);border-color:var(--cyan);box-shadow:0 0 22px rgba(79,227,255,.18)}
.btn.warn{border-color:rgba(255,59,74,.6)}
.btn:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
/* HUD */
#hud{position:absolute;inset:0;pointer-events:none}
#objective{position:absolute;left:calc(16px + var(--sal));top:calc(12px + var(--sat));font-size:15px;color:var(--dim);max-width:30vw;text-shadow:0 1px 3px #000}
#objective b{display:block;color:var(--txt);font-size:17px}
#stats{position:absolute;right:calc(16px + var(--sar));top:calc(12px + var(--sat));text-align:right;font-size:15px;color:var(--dim);text-shadow:0 1px 3px #000}
#stats .speed{font-size:26px;color:var(--txt);font-weight:800;font-variant-numeric:tabular-nums}
#charges{display:flex;gap:6px;justify-content:flex-end;margin-top:6px}
#charges i{width:20px;height:20px;border-radius:50%;border:2px solid var(--cyan);display:block}
#charges i.on{background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
#charges .earn{width:44px;height:6px;border-radius:3px;background:rgba(79,227,255,.18);align-self:center;overflow:hidden}
#charges .earn b{display:block;height:100%;background:var(--cyan)}
#dmg{width:120px;height:8px;background:rgba(255,255,255,.12);border-radius:4px;margin:6px 0 0 auto;overflow:hidden}
#dmg b{display:block;height:100%;background:linear-gradient(90deg,var(--amber),var(--red));width:0}
#pauseTouch{position:absolute;right:calc(12px + var(--sar));top:calc(118px + var(--sat));pointer-events:auto;width:56px;height:56px;border-radius:14px;background:rgba(10,20,36,.7);border:1px solid rgba(255,255,255,.2);font-size:22px}
/* radio forecast panel */
#radio{position:absolute;left:50%;top:calc(10px + var(--sat));transform:translateX(-50%);width:min(620px,58vw);padding:10px 16px 12px;border-radius:14px;background:rgba(5,12,24,.82);border:1px solid rgba(79,227,255,.35);transition:opacity .4s, border-color .3s}
#radio{background:repeating-linear-gradient(0deg,rgba(79,227,255,.05) 0 2px,transparent 2px 4px),rgba(3,12,24,.86);box-shadow:0 0 26px rgba(79,227,255,.16)}
#radio::after{content:"";position:absolute;inset:0;border-radius:14px;pointer-events:none;opacity:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.22) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(79,227,255,.18) 0 7px,transparent 7px 19px)}
#radio.glitch.glitch{animation:glitch .5s steps(1) 1}
#radio.glitch::after{animation:stat .5s steps(1) 1}
#radio.glitch .text,#radio.glitch .top{animation:chroma .5s steps(1) 1}
#radio.glitch-soft .text{animation:chromaSoft .5s ease-out 1}
@keyframes glitch{0%{transform:translateX(calc(-50% - 6px));clip-path:inset(0 0 55% 0)}12%{transform:translateX(calc(-50% + 5px));clip-path:inset(30% 0 0 0)}24%{transform:translateX(calc(-50% - 2px));clip-path:none;opacity:.55}36%{transform:translateX(calc(-50% + 3px));opacity:1}50%{transform:translateX(-50%)}62%{transform:translateX(calc(-50% - 2px));opacity:.8}75%,100%{transform:translateX(-50%);opacity:1}}
@keyframes stat{0%{opacity:.75;background-position:0 0,0 0}20%{opacity:.5;background-position:0 3px,11px 0}40%{opacity:.65;background-position:0 1px,-7px 0}60%{opacity:.3}80%{opacity:.15}100%{opacity:0}}
@keyframes chroma{0%,40%{text-shadow:-3px 0 rgba(255,30,90,.9),3px 0 rgba(60,240,255,.9)}60%{text-shadow:-1px 0 rgba(255,30,90,.6),1px 0 rgba(60,240,255,.6)}100%{text-shadow:none}}
@keyframes chromaSoft{0%{text-shadow:-2px 0 rgba(255,30,90,.6),2px 0 rgba(60,240,255,.6)}100%{text-shadow:none}}
#radio.unstable{border-color:var(--amber);animation:jit .12s infinite}
#radio.superseded{opacity:.38}
#radio.new{border-color:#9ff}
@keyframes jit{50%{transform:translateX(calc(-50% + 1px))}}
#radio .top{display:flex;align-items:center;gap:10px;font-size:13px;letter-spacing:.14em;color:var(--cyan);font-weight:700}
#radio .state{padding:2px 8px;border-radius:6px;background:rgba(79,227,255,.15)}
#radio.unstable .state{background:rgba(255,179,71,.25);color:var(--amber)}
#radio .wave{width:64px;height:18px}
#radio .text{font-size:calc(21px * var(--cap));line-height:1.25;margin-top:6px;font-weight:650}
#radio .bar{height:8px;border-radius:4px;background:rgba(255,255,255,.12);margin-top:8px;overflow:hidden;position:relative}
#radio .bar b{position:absolute;left:0;top:0;bottom:0;background:var(--cyan);width:100%}
#radio.unstable .bar b{background:repeating-linear-gradient(90deg,var(--amber) 0 8px,transparent 8px 14px)}
#radio .secs{margin-left:auto;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;color:#fff;letter-spacing:0}
#radio .secs:empty{display:none}
#radio .secs+.state{margin-left:8px}
#radio .secs:empty+.state{margin-left:auto}
#caption{position:absolute;left:calc(14px + var(--sal));top:calc(84px + var(--sat));max-width:min(380px,29vw);text-align:left;font-size:calc(19px * var(--cap));line-height:1.3;padding:10px 14px;border-radius:12px;background:rgba(3,8,18,.78);border-left:3px solid rgba(147,164,187,.6);text-shadow:0 1px 2px #000}
#caption.nav{background:rgba(14,16,22,.84);border-left-color:var(--amber);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
#caption.nav .who{color:var(--amber)}
#caption.future,#caption.echo{background:repeating-linear-gradient(0deg,rgba(79,227,255,.06) 0 2px,transparent 2px 4px),rgba(2,14,26,.86);border-left:3px solid var(--cyan);box-shadow:0 0 18px rgba(79,227,255,.18),inset 0 0 0 1px rgba(79,227,255,.22);font-style:italic;text-shadow:-1px 0 rgba(255,40,90,.45),1px 0 rgba(79,227,255,.55)}
#caption.echo{border-left-color:var(--red);box-shadow:0 0 18px rgba(255,59,74,.2),inset 0 0 0 1px rgba(255,59,74,.25)}
#caption .ico{font-style:normal;margin-right:6px}
#caption .who{display:block;font-size:12px;letter-spacing:.18em;color:var(--dim);font-weight:700;margin-bottom:2px}
#caption.future .who{color:var(--cyan)} #caption.echo .who{color:var(--red)} #caption.echo{color:#ffd6da;animation:jit .2s infinite}
#caption .pending{font-size:11px;color:var(--dim);margin-left:6px;letter-spacing:.08em}
#prompt{position:absolute;left:50%;top:calc(124px + var(--sat));transform:translateX(-50%);font-size:calc(21px * var(--cap));font-weight:800;text-align:center;padding:9px 18px;border-radius:16px;background:rgba(5,12,24,.78);border:2px solid var(--amber);max-width:80vw}
#prompt small{display:block;font-size:14px;font-weight:600;color:var(--dim);margin-top:4px}
#toast{position:absolute;left:50%;top:calc(196px + var(--sat));transform:translateX(-50%);font-size:22px;font-weight:800;letter-spacing:.18em;color:var(--cyan);text-shadow:0 0 12px rgba(79,227,255,.6)}
#behind{position:absolute;bottom:calc(112px + var(--sab));width:46px;height:30px;margin-left:-23px;color:var(--red);font-size:26px;text-align:center;text-shadow:0 0 10px var(--red)}
/* touch controls */
#touchCtl{position:absolute;inset:0;pointer-events:none}
#steerRing{position:absolute;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;border:2px solid rgba(79,227,255,.28)}
#steerKnob{position:absolute;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(79,227,255,.25);border:2px solid rgba(79,227,255,.6)}
#steerHint{position:absolute;left:calc(24px + var(--sal));bottom:calc(24px + var(--sab));width:38vw;height:30vh;border:2px dashed rgba(79,227,255,.18);border-radius:22px;color:rgba(200,240,255,.55);display:flex;align-items:flex-end;justify-content:center;padding:12px;font-size:15px}
.tbtn{position:absolute;pointer-events:auto;border-radius:50%;font-weight:800;letter-spacing:.06em;display:flex;align-items:center;justify-content:center;flex-direction:column;touch-action:none}
#tBrake{right:calc(28px + var(--sar));bottom:calc(28px + var(--sab));width:150px;height:150px;background:rgba(255,59,74,.16);border:3px solid rgba(255,59,74,.7);font-size:20px}
#tBrake.on{background:rgba(255,59,74,.5)}
#tRewind{right:calc(196px + var(--sar));bottom:calc(46px + var(--sab));width:112px;height:112px;background:rgba(79,227,255,.12);border:3px solid rgba(79,227,255,.7);font-size:16px}
#tRewind.empty,#dRewind.empty{opacity:.45}
.left #tBrake{right:auto;left:calc(28px + var(--sal))} .left #tRewind{right:auto;left:calc(196px + var(--sal))} .left #steerHint{left:auto;right:calc(24px + var(--sar))}
.single #tBrake{display:none} .single #tRewind{right:calc(28px + var(--sar));width:130px;height:130px}
#singleLine{position:absolute;left:0;right:0;border-top:2px dashed rgba(255,59,74,.45);pointer-events:none;color:rgba(255,120,130,.8);font-size:13px;padding-left:12px}
/* trackpad dock */
#dock{position:absolute;left:0;right:0;bottom:0;height:calc(100px + var(--sab));padding-bottom:var(--sab);display:flex;align-items:center;justify-content:center;gap:22px;background:linear-gradient(180deg,rgba(5,10,22,0),rgba(5,10,22,.88) 30%);border-top:1px solid rgba(79,227,255,.18)}
#dock .btn{min-width:170px;min-height:68px;font-size:21px}
#dBrake.on{background:rgba(255,59,74,.55);border-color:var(--red);box-shadow:0 0 24px rgba(255,59,74,.45)}
#dockHint{position:absolute;left:16px;bottom:calc(12px + var(--sab));font-size:12px;color:var(--dim);max-width:22vw}
/* screens */
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(20px + var(--sat)) calc(20px + var(--sar)) calc(20px + var(--sab)) calc(20px + var(--sal));background:radial-gradient(ellipse at 50% 35%,rgba(14,34,60,.82),rgba(3,7,16,.94));overflow:auto}
.screen.clear{background:rgba(3,7,16,.55)}
#scr-title{background:radial-gradient(ellipse at 50% 42%,rgba(4,10,22,.72),rgba(3,7,16,.30) 75%)}
.panel{width:min(760px,96vw);max-height:100%;overflow:auto;text-align:center}
h1{font-size:clamp(34px,6.4vw,70px);margin:0 0 4px;letter-spacing:.08em;font-weight:900;line-height:1.02;text-shadow:0 0 30px rgba(79,227,255,.35)}
h1 em{font-style:normal;color:var(--cyan)}
h2{font-size:clamp(24px,3.6vw,36px);margin:0 0 12px;letter-spacing:.06em}
.sub{color:var(--dim);font-size:17px;margin-bottom:20px}
.row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.choice{width:min(330px,44vw);min-height:150px;text-align:left;padding:18px;border-radius:16px;background:rgba(14,28,48,.9);border:2px solid rgba(255,255,255,.12)}
.choice.suggest{border-color:var(--cyan)}
.choice b{font-size:22px;display:block;margin-bottom:6px} .choice span{color:var(--dim);font-size:15px;line-height:1.35;display:block}
.choice .tag{color:var(--cyan);font-size:12px;letter-spacing:.14em;margin-bottom:4px}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:10px 22px;text-align:left;margin:10px 0}
.settings label{display:flex;flex-direction:column;gap:6px;font-size:15px;color:var(--dim);min-height:56px;justify-content:center}
.settings label.tog{flex-direction:row;align-items:center;gap:12px}
.settings input[type=range]{width:100%;height:36px}
.settings input[type=checkbox]{width:28px;height:28px}
.settings select{min-height:44px;font-size:16px;border-radius:10px;background:#0d1a2e;color:var(--txt);border:1px solid rgba(255,255,255,.2);padding:0 10px}
.stats{display:grid;grid-template-columns:1fr auto;gap:6px 24px;text-align:left;font-size:17px;max-width:520px;margin:10px auto}
.stats span:nth-child(2n){text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.medal{font-size:20px;font-weight:900;letter-spacing:.14em;margin:6px 0}
.medalwrap{min-height:40px;display:flex;align-items:center;justify-content:center}
.medal.pre{opacity:0;transform:scale(1.8)} .medal.shown{opacity:1}
.medal.stamp{animation:stamp .55s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stamp{0%{opacity:0;transform:scale(2.2);filter:blur(4px)}60%{opacity:1;filter:blur(0)}100%{opacity:1;transform:scale(1)}}
.medal.gold.stamp,.medal.gold.shown{text-shadow:0 0 18px rgba(255,211,107,.7)} .medal.silver.stamp{text-shadow:0 0 16px rgba(214,226,238,.6)} .medal.bronze.stamp{text-shadow:0 0 14px rgba(224,160,112,.55)}
.medal.gold{color:#ffd36b} .medal.silver{color:#d6e2ee} .medal.bronze{color:#e0a070} .medal.none{color:var(--dim)}
.tip{margin:12px auto;max-width:560px;padding:12px 16px;border-radius:12px;background:rgba(79,227,255,.08);border:1px solid rgba(79,227,255,.25);font-size:16px}
.small{font-size:13px;color:var(--dim)}
.howto{text-align:left;font-size:16px;line-height:1.45}
.howto h3{margin:14px 0 4px;color:var(--cyan);font-size:16px;letter-spacing:.1em}
#rotate{z-index:50}
#endcap{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);width:min(880px,88vw);text-align:center;font-size:calc(30px * var(--cap));font-weight:750;line-height:1.3}
#endcap .who{display:block;font-size:13px;letter-spacing:.24em;margin-bottom:8px}
#debug{position:absolute;left:8px;bottom:calc(108px + var(--sab));font:12px/1.35 ui-monospace,Menlo,monospace;background:rgba(0,0,0,.7);padding:8px 10px;border-radius:8px;white-space:pre;pointer-events:none;color:#9fe}
#fade{position:absolute;inset:0;background:#02050c;opacity:0;pointer-events:none;transition:opacity .35s}
#fade.on{opacity:1}
#calibUI{position:absolute;left:50%;top:22%;transform:translateX(-50%);text-align:center;font-size:20px;font-weight:700;background:rgba(5,12,24,.8);padding:12px 18px;border-radius:14px;border:1px solid rgba(79,227,255,.35)}
@media (max-width:900px){#radio{width:min(560px,56vw)} #caption{max-width:26vw;font-size:calc(17px * var(--cap))} #objective{max-width:24vw;font-size:13px} #dock .btn{min-width:140px}}
@media (max-height:640px){#caption{top:calc(70px + var(--sat))} #tBrake{width:124px;height:124px} #tRewind{width:96px;height:96px;right:calc(170px + var(--sar))}}
@media (prefers-reduced-motion:reduce){#radio.unstable,#caption.echo,#radio.glitch.glitch{animation:none}}
body.rw #prompt{display:none!important}
</style>
</head>
<body>
<div id="app">
  <canvas id="view" aria-label="Driving view"></canvas>
  <div id="play"></div>
  <div id="hud" class="hidden">
    <div id="objective"><b id="objText">Reach the river transmitter.</b><span id="routeText"></span></div>
    <div id="stats"><div class="speed"><span id="spd">0</span> <small>km/h</small></div><div id="charges"></div><div id="dmg"><b></b></div><div class="small" id="assistTag"></div></div>
    <div id="radio" class="hidden"><div class="top"><svg class="wave" viewBox="0 0 64 18"><polyline id="wavePath" fill="none" stroke="currentColor" stroke-width="2" points="0,9 64,9"/></svg><span id="radioWho">EMERGENCY BAND · YOU</span><span class="secs" id="radioSecs"></span><span class="state" id="radioState">FORECAST</span></div><div class="text" id="radioText"></div><div class="bar"><b id="radioBar"></b></div></div>
    <div id="caption" class="hidden"><span class="who" id="capWho"></span><span id="capText"></span></div>
    <div id="prompt" class="hidden"></div>
    <div id="toast" class="hidden"></div>
    <div id="behind" class="hidden">▲</div>
    <button id="pauseTouch" aria-label="Pause">❚❚</button>
  </div>
  <div id="touchCtl" class="hidden">
    <div id="steerHint">Steer: hold &amp; slide anywhere here</div>
    <div id="steerRing" class="hidden"><div id="steerKnob"></div></div>
    <div id="singleLine" class="hidden">drag below this line to brake</div>
    <button class="tbtn" id="tRewind" aria-label="Rewind">⟲<span>REWIND</span></button>
    <button class="tbtn" id="tBrake" aria-label="Brake">BRAKE<span class="small">hold</span></button>
  </div>
  <div id="dock" class="hidden">
    <button class="btn" id="dBrake">BRAKE</button>
    <button class="btn" id="dRewind">⟲ REWIND</button>
    <button class="btn" id="dPause">❚❚ PAUSE</button>
    <div id="dockHint">Move to steer · Click to use</div>
  </div>
  <div id="calibUI" class="hidden"></div>
  <div id="endcap" class="hidden"><span class="who" id="endWho"></span><span id="endText"></span></div>
  <div id="debug" class="hidden"></div>
  <div id="screens"></div>
  <div id="fade"></div>
</div>

    var list = Array.prototype.slice.call(root.querySelectorAll(sel));
    if (CFG.menuFilter) list = list.filter(CFG.menuFilter);
    return list.filter(visible);
  }
  function setFocus(el) {
    if (S.focusEl && S.focusEl !== el) S.focusEl.classList.remove("padport-focus");
    S.focusEl = el;
    if (el) { el.classList.add("padport-focus"); try { el.focus({ preventScroll: true }); } catch (e) {} }
  }
  function moveFocus(dir) {
    var items = menuItems();
    if (!items.length) return;
    var cur = S.focusEl && items.indexOf(S.focusEl) >= 0 ? S.focusEl : null;
    if (!cur) {
      var pref = null;
      if (CFG.menuDefault) for (var j = 0; j < items.length && !pref; j++) if (items[j].matches && items[j].matches(CFG.menuDefault)) pref = items[j];
      setFocus(pref || items[0]); return;
    }
    var r0 = cur.getBoundingClientRect(), cx = r0.left + r0.width / 2, cy = r0.top + r0.height / 2;
    var best = null, bestS = 1e9;
    items.forEach(function (el) {
      if (el === cur) return;
      var r = el.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
      var dx = x - cx, dy = y - cy, main, side;
      if (dir === "up") { main = -dy; side = Math.abs(dx); }
      else if (dir === "down") { main = dy; side = Math.abs(dx); }
      else if (dir === "left") { main = -dx; side = Math.abs(dy); }
      else { main = dx; side = Math.abs(dy); }
      if (main <= 4) return;
      var sc = main + side * 2.2;
      if (sc < bestS) { bestS = sc; best = el; }
    });
    if (!best) {
      var i = items.indexOf(cur);
      if (dir === "down" || dir === "right") best = items[(i + 1) % items.length];
      else best = items[(i - 1 + items.length) % items.length];
    }
    setFocus(best);
  }
  function adjustRange(el, d) {
    if (!el || el.type !== "range") return false;
    var step = +el.step || ((+el.max - +el.min) / 20) || 1;
    el.value = Math.max(+el.min, Math.min(+el.max, +el.value + d * step));
    el.dispatchEvent(new Event("input", { bubbles: true }));
    el.dispatchEvent(new Event("change", { bubbles: true }));
    return true;
  }

  /* ---- status line ---- */
  var bar = null;
  function ensureBar() {
    if (bar || !document.body) return;
    var css = document.createElement("style");
    css.textContent = "#padport-status{position:fixed;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);" +
      "z-index:2147483646;pointer-events:none;font:600 13px/1.35 -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;" +
      "color:#fff;background:rgba(10,12,20,.78);border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:6px 14px;" +
      "max-width:92vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.35)}" +
      "#padport-status small{display:block;font-weight:500;font-size:11px;opacity:.75}" +
      "#padport-status.ok{border-color:rgba(120,255,160,.6)}" +
      ".padport-focus{outline:3px solid #ffd23f !important;outline-offset:3px !important;box-shadow:0 0 0 6px rgba(255,210,63,.35) !important}";
    document.head.appendChild(css);
    bar = document.createElement("div");
    bar.id = "padport-status";
    bar.setAttribute("aria-live", "polite");
    bar.textContent = NONE;
    document.body.appendChild(bar);
  }
  var lastText = "";
  function paint(pad, st) {
    ensureBar();
    if (!bar) return;
    var show = CFG.isTitle ? !!CFG.isTitle() : true;
    if (!show && CFG.showWhenMenu && isMenu()) show = true;
    bar.style.display = show ? "" : "none";
    if (!show) return;
    var main, sub = "";
    if (pad) {
      var id = ""; try { id = String(pad.id || "Gamepad"); } catch (e) { id = "Gamepad"; }
      if (id.length > 60) id = id.slice(0, 60) + "\u2026";
      main = "Controller: " + id + " \u2713";
      sub = (CFG.hint || "Press A or Start to play") + " \u00b7 buttons: " + ((st && st.heldList.join(" ")) || "none");
    } else {
      main = NONE;
      if (typeof navigator.getGamepads !== "function") sub = "This browser has no gamepad support.";
      else sub = "Pair the pad in Bluetooth settings, then press A. Keyboard / touch still work.";
    }
    if (S.err) sub = "Input error: " + S.err;
    S.status = main;
    var t = main + "|" + sub;
    if (t !== lastText) { lastText = t; bar.innerHTML = ""; bar.appendChild(document.createTextNode(main)); var s = document.createElement("small"); s.textContent = sub; bar.appendChild(s); }
    bar.className = pad ? "ok" : "";
  }

  function isMenu() { return CFG.isMenu ? !!CFG.isMenu() : false; }

  var api = {
    key: key, tap: tap, hold: hold, releaseAll: releaseAll, pointer: pointer, click: click, visible: visible, $: $, $$: $$,
    moveFocus: moveFocus, menuItems: menuItems, setFocus: setFocus
  };
  S.api = api;

  function edge(st, name) { return st[name] && !S.prev[name]; }

  function poll() {
    S.polls++;
    S.last = Date.now();
    var pad = null, st = null;
    try {
      pad = choose(listPads());
      S.pad = pad;
      if (pad) { st = read(pad); S.seen = true; }
      paint(pad, st);
      if (!st) { releaseAll(); S.prev = {}; return; }
      var E = {}; ["A", "B", "X", "Y", "LB", "RB", "LT", "RT", "BACK", "START", "up", "down", "left", "right", "any"].forEach(function (n) { E[n] = edge(st, n); });
      var gate = CFG.titleGate || CFG.isTitle;
      var nowT = Date.now(), dt = Math.min(0.1, Math.max(0.001, (nowT - (S.tPrev || nowT)) / 1000)); S.tPrev = nowT; st.dt = dt;
      if (gate && gate() && E.any && CFG.titleStart) {
        releaseAll();
        CFG.titleStart(api, st, E);
      } else if (isMenu()) {
        releaseAll();
        var now = Date.now(), dir = st.up ? "up" : st.down ? "down" : st.left ? "left" : st.right ? "right" : "";
        if (dir && (dir !== S.navDir || now - S.navT > 260)) {
          if ((dir === "left" || dir === "right") && S.focusEl && S.focusEl.type === "range") adjustRange(S.focusEl, dir === "left" ? -1 : 1);
          else moveFocus(dir);
          S.navT = now;
        }
        S.navDir = dir;
        if (S.focusEl && !visible(S.focusEl)) setFocus(null);
        if (E.A) {
          var f = S.focusEl;
          if (!f) { moveFocus("down"); f = S.focusEl; }
          if (f) { if (CFG.menuActivate) CFG.menuActivate(api, f); else click(f); }
        }
        if (E.B && CFG.menuBack) CFG.menuBack(api);
        if (E.START && CFG.menuStart) CFG.menuStart(api);
      } else {
        if (S.focusEl) setFocus(null);
        S.navDir = "";
        if (CFG.play) CFG.play(api, st, E);
      }
      S.prev = st;
    } catch (e) {
      S.err = String(e && e.message || e);
      try { paint(pad, st); } catch (e2) {}
    }
  }
  function frame() { poll(); requestAnimationFrame(frame); }
  function start() {
    ensureBar();
    requestAnimationFrame(frame);
    setInterval(function () { if (Date.now() - S.last > 120) poll(); }, 50);
    window.addEventListener("gamepadconnected", function () { poll(); });
    window.addEventListener("gamepaddisconnected", function () { poll(); });
    window.addEventListener("blur", function () { releaseAll(); });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start); else start();
})();

</script>
